<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Thraksha Guardian - Scan in Progress</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#4cd6ff",

                        "surface": "#121315",

                        "tertiary-fixed": "#e3e2e4",
                        "tertiary-fixed-dim": "#c7c6c8",
                        "inverse-on-surface": "#303033",
                        "on-primary-fixed": "#001f28",
                        "tertiary": "#dddcde",
                        "surface-container-lowest": "#0d0e10",
                        "surface-variant": "#343537",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "background": "#121315",
                        "inverse-surface": "#e3e2e5",
                        "primary-fixed-dim": "#4cd6ff",
                        "secondary-fixed-dim": "#bfc2ff",
                        "on-error-container": "#ffdad6",
                        "on-primary": "#003543",
                        "secondary-container": "#1e24db",
                        "on-secondary-fixed": "#00006e",
                        "on-tertiary-fixed-variant": "#464749",
                        "on-secondary-fixed-variant": "#1a20d8",
                        "on-tertiary-fixed": "#1b1c1e",
                        "surface-container-low": "#1b1c1e",
                        "secondary-fixed": "#e0e0ff",
                        "tertiary-container": "#c1c0c3",
                        "on-tertiary": "#303032",
                        "on-surface-variant": "#bbc9cf",
                        "surface-bright": "#38393b",
                        "secondary": "#bfc2ff",
                        "surface-container-high": "#292a2c",
                        "outline-variant": "#3c494e",
                        "primary": "#a4e6ff",
                        "on-background": "#e3e2e5",
                        "primary-container": "#00d1ff",
                        "on-secondary-container": "#adb2ff",
                        "on-secondary": "#0000ac",
                        "on-tertiary-container": "#4e4e51",
                        "on-primary-fixed-variant": "#004e60",
                        "surface-container-highest": "#343537",
                        "outline": "#859399",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "base": "8px",
                        "container-padding": "20px",
                        "margin-mobile": "16px",
                        "margin-desktop": "32px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-caps": ["JetBrains Mono"],

                        "body-lg": ["Inter"],
                        "label-md": ["Inter"],
                        "headline-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "label-caps": ["12px", { "lineHeight": "16px", "letterSpacing": "0.1em", "fontWeight": "500" }],

                }
            }
        }
    </script>
<style>
        .pulse-ring {
            animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: .3;
                transform: scale(1.1);
            }
        }
        .spin-slow {
            animation: spin 8s linear infinite;
        }
        @keyframes spin {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col antialiased">
<!-- TopAppBar (Transactional Screen - Suppressed Nav, but keeps header) -->
<header class="w-full top-0 bg-surface dark:bg-surface flex justify-between items-center px-margin-mobile h-16 w-full z-10">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-primary dark:text-primary transition-colors duration-200">shield_lock</span>
<h1 class="font-headline-md text-headline-md text-on-surface dark:text-on-surface font-bold tracking-tight">Thraksha Guardian</h1>
</div>
<button aria-label="Status" class="hover:bg-surface-variant/20 dark:hover:bg-surface-variant/20 p-2 rounded-full transition-colors duration-200">
<span class="material-symbols-outlined text-primary dark:text-primary">check_circle</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile py-8 relative overflow-hidden z-0">
<!-- Background Ambient Glow -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none opacity-20">
<div class="w-96 h-96 bg-primary-container rounded-full blur-[100px]"></div>
</div>
<!-- Scanning Animation Area -->
<div class="relative w-64 h-64 flex items-center justify-center mb-12">
<!-- Outer rotating dashed ring -->
<svg class="absolute inset-0 w-full h-full text-outline-variant spin-slow" fill="none" stroke="currentColor" stroke-dasharray="4 8" stroke-width="1" viewbox="0 0 100 100">
<circle cx="50" cy="50" r="48"></circle>
</svg>
<!-- Pulsing rings -->
<div class="absolute inset-0 border-2 border-primary-container rounded-full pulse-ring opacity-50"></div>
<div class="absolute inset-4 border border-primary rounded-full pulse-ring" style="animation-delay: 0.5s;"></div>
<!-- Central Icon -->
<div class="z-10 bg-surface-container rounded-full p-6 shadow-[0_0_30px_rgba(0,209,255,0.15)]">
<span class="material-symbols-outlined text-primary-container text-6xl" style="font-variation-settings: 'FILL' 0;">radar</span>
</div>
</div>
<!-- Typography -->
<div class="text-center max-w-md mx-auto space-y-4 mb-16 z-10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Scanning device...</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Checking apps and network configuration.</p>
</div>
<!-- Actions -->
<div class="mt-auto w-full max-w-sm z-10 pb-8">
<button class="w-full flex items-center justify-center py-4 px-6 rounded-full border border-outline-variant text-on-surface hover:bg-surface-variant/30 active:scale-95 transition-all duration-200 font-label-md text-label-md">
                Cancel Scan
            </button>
</div>
</main>
<!-- Navigation Suppressed for Transactional/Task-Focused Screen per strict guidelines -->
</body></html>
