<style>
        .glow-effect {
            box-shadow: 0 0 40px rgba(0, 209, 255, 0.15);
        }
        .fade-in-up {
            animation: fadeInUp 0.8s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-center font-body-md relative overflow-hidden">
<!-- Ambient Background Element -->
<div class="absolute inset-0 z-0 flex items-center justify-center pointer-events-none opacity-20">
<div class="w-[600px] h-[600px] rounded-full bg-primary-container blur-[150px]"></div>
</div>
<!-- Main Content Canvas -->
<main class="z-10 flex flex-col items-center justify-center w-full max-w-md px-margin-mobile text-center">
<!-- Icon Container -->
<div class="fade-in-up delay-1 mb-10 relative">
<div class="w-32 h-32 rounded-full bg-surface-container-high border border-outline-variant flex items-center justify-center glow-effect shadow-2xl">
<span class="material-symbols-outlined text-[64px] text-primary-container" style="font-variation-settings: 'FILL' 1;">
                    check_circle
                </span>
</div>
<!-- Subtle ring decoration -->
<div class="absolute inset-0 rounded-full border border-primary-container opacity-30 scale-110 animate-[ping_3s_cubic-bezier(0,0,0.2,1)_infinite]"></div>
</div>
<!-- Typography -->
<h1 class="fade-in-up delay-2 font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-4 tracking-tight">
            Restoration Complete
        </h1>
<p class="fade-in-up delay-3 font-body-lg text-body-lg text-on-surface-variant mb-12 max-w-[280px] leading-relaxed">
            Routine Ended. Previous settings successfully restored.
        </p>
<!-- Action Button -->
<div class="fade-in-up delay-3 w-full">
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-4 rounded-xl shadow-lg hover:bg-primary transition-all duration-300 active:scale-95 flex items-center justify-center gap-2 group relative overflow-hidden">
<div class="absolute inset-0 bg-white/20 translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out"></div>
<span class="relative z-10 font-semibold tracking-wide">Return to Dashboard</span>
<span class="material-symbols-outlined text-[18px] relative z-10 group-hover:translate-x-1 transition-transform">
                    arrow_forward
                </span>
</button>
</div>
</main>
<!-- Suppressed TopAppBar and BottomNavBar due to transaction/success screen intent as per logic rules -->
