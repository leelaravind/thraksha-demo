<style>
        body {
            background-color: #0B0C0E;
            color: #e3e2e5;
        }
        
        .pulse-ring {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pulse-ring::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #00D1FF;
            animation: pulse 2s linear infinite;
            opacity: 0;
        }

        .pulse-ring::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #00D1FF;
            animation: pulse 2s linear infinite;
            animation-delay: 1s;
            opacity: 0;
        }

        @keyframes pulse {
            0% {
                transform: scale(0.8);
                opacity: 0.8;
            }
            100% {
                transform: scale(1.5);
                opacity: 0;
            }
        }
        
        .scan-item {
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.5s forwards;
        }
        
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="min-h-screen flex flex-col font-sans antialiased overflow-hidden">
<!-- TopAppBar -->
<header class="w-full top-0 bg-surface dark:bg-surface flex justify-between items-center px-margin-mobile h-16 w-full flat no shadows transition-colors duration-200 z-10 sticky">
<button class="p-2 -ml-2 rounded-full hover:bg-surface-variant/20 dark:hover:bg-surface-variant/20 text-on-surface-variant dark:text-on-surface-variant transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">shield_lock</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface dark:text-on-surface font-bold tracking-tight">EXISTING THRAKSHA LOGO</h1>
<div class="w-10"></div> <!-- Placeholder for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile pb-margin-desktop relative">
<!-- Animated Background Glow -->
<div class="absolute inset-0 flex items-center justify-center opacity-20 pointer-events-none">
<div class="w-96 h-96 bg-primary-container rounded-full blur-[100px] animate-pulse" style="animation-duration: 4s;"></div>
</div>
<!-- Hero Area: Scanner Animation -->
<div class="relative z-10 flex flex-col items-center w-full max-w-md mx-auto mt-8">
<div class="w-48 h-48 mb-12 pulse-ring">
<div class="w-32 h-32 rounded-full bg-surface-container flex items-center justify-center z-10 shadow-[0_0_40px_rgba(0,209,255,0.1)] border border-surface-variant">
<span class="material-symbols-outlined text-[64px] text-primary-container" style="font-variation-settings: 'FILL' 1;">security_update_good</span>
</div>
</div>
<!-- Scanning Status Text -->
<div class="text-center space-y-4 mb-16 w-full">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Scanning device...</h2>
<div class="h-6 overflow-hidden relative w-full flex justify-center">
<p class="font-body-lg text-body-lg text-on-surface-variant absolute w-full transition-all duration-500" id="scan-status">Checking apps configuration</p>
</div>
</div>
<!-- Progress Details (Simulated) -->
<div class="w-full bg-surface rounded-xl p-6 border border-surface-variant/50 shadow-sm mb-12">
<div class="space-y-4">
<div class="flex items-center gap-3 scan-item" style="animation-delay: 0.2s;">
<span class="material-symbols-outlined text-primary-container text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md text-body-md text-on-surface">System integrity verified</span>
</div>
<div class="flex items-center gap-3 scan-item" style="animation-delay: 1.5s;">
<span class="material-symbols-outlined text-primary-container text-sm" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body-md text-body-md text-on-surface">Network protocols checked</span>
</div>
<div class="flex items-center gap-3 scan-item" style="animation-delay: 2.8s;">
<span class="material-symbols-outlined text-surface-variant text-sm animate-spin">sync</span>
<span class="font-body-md text-body-md text-on-surface-variant">Analyzing app permissions...</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full py-4 px-6 rounded-full border border-outline-variant text-on-surface font-label-md text-label-md tracking-wide hover:bg-surface-variant/30 active:scale-95 transition-all duration-200">
                Cancel Scan
            </button>
</div>
</main>
<script>
        // Simple script to cycle through scanning text for atmospheric effect
        const statuses = [
            "Checking apps configuration",
            "Analyzing network protocols",
            "Verifying system integrity",
            "Scanning file system anomalies",
            "Reviewing background services"
        ];
        
        const statusElement = document.getElementById('scan-status');
        let currentIndex = 0;
        
        setInterval(() => {
            statusElement.style.opacity = 0;
            statusElement.style.transform = 'translateY(-10px)';
            
            setTimeout(() => {
                currentIndex = (currentIndex + 1) % statuses.length;
                statusElement.textContent = statuses[currentIndex];
                
                statusElement.style.transform = 'translateY(10px)';
                
                // Force reflow
                void statusElement.offsetWidth;
                
                statusElement.style.opacity = 1;
                statusElement.style.transform = 'translateY(0)';
            }, 500);
        }, 3000);
    </script>
