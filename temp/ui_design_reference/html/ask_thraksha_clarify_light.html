<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Thraksha Guardian - Mode Selection</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-surface": "#e3e2e5",
                      "on-secondary-fixed": "#00006e",
                      "on-surface-variant": "#bbc9cf",
                      "tertiary-fixed-dim": "#c7c6c8",
                      "tertiary-container": "#c1c0c3",
                      "secondary": "#bfc2ff",
                      "surface-variant": "#343537",
                      "outline": "#859399",
                      "error-container": "#93000a",
                      "surface-container-low": "#1b1c1e",
                      "on-tertiary-container": "#4e4e51",
                      "on-secondary": "#0000ac",
                      "secondary-container": "#1e24db",
                      "on-secondary-fixed-variant": "#1a20d8",
                      "on-tertiary": "#303032",
                      "on-tertiary-fixed-variant": "#464749",
                      "surface-dim": "#121315",
                      "primary-fixed-dim": "#4cd6ff",
                      "on-primary-fixed-variant": "#004e60",
                      "surface": "#121315",
                      "background": "#121315",
                      "inverse-primary": "#00677f",
                      "tertiary-fixed": "#e3e2e4",
                      "on-primary-container": "#00566a",
                      "secondary-fixed-dim": "#bfc2ff",
                      "on-secondary-container": "#adb2ff",
                      "secondary-fixed": "#e0e0ff",
                      "on-background": "#e3e2e5",
                      "surface-container-lowest": "#0d0e10",
                      "error": "#ffb4ab",
                      "outline-variant": "#3c494e",
                      "surface-container": "#1f2022",
                      "surface-bright": "#38393b",
                      "surface-container-highest": "#343537",
                      "primary": "#a4e6ff",
                      "surface-tint": "#4cd6ff",
                      "on-error-container": "#ffdad6",
                      "on-surface": "#e3e2e5",
                      "primary-fixed": "#b7eaff",
                      "primary-container": "#00d1ff",
                      "on-error": "#690005",
                      "on-tertiary-fixed": "#1b1c1e",
                      "on-primary-fixed": "#001f28",
                      "inverse-on-surface": "#303033",
                      "tertiary": "#dddcde",
                      "on-primary": "#003543",
                      "surface-container-high": "#292a2c"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "margin-mobile": "16px",
                      "margin-desktop": "32px",
                      "base": "8px",
                      "gutter": "16px",
                      "container-padding": "20px"
              },
              "fontFamily": {
                      "body-md": [
                              "Inter"
                      ],
                      "headline-lg": [
                              "Inter"
                      ],
                      "headline-lg-mobile": [
                              "Inter"
                      ],
                      "headline-md": [
                              "Inter"
                      ],
                      "label-md": [
                              "Inter"
                      ],
                      "label-caps": [
                              "JetBrains Mono"
                      ],
                      "body-lg": [
                              "Inter"
                      ]
              },
              "fontSize": {
                      "body-md": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg-mobile": [
                              "28px",
                              {
                                      "lineHeight": "36px",
                                      "letterSpacing": "-0.02em",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-md": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "600"
                              }
                      ],
                      "label-md": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "fontWeight": "500"
                              }
                      ],
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.1em",
                                      "fontWeight": "500"
                              }
                      ],
                      "body-lg": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ]
              }
      },
          },
        }
      </script>
<style>
        body {
            background-color: #0B0C0E;
            color: #e3e2e5;
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md antialiased">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-surface dark:bg-surface flex items-center justify-between px-margin-mobile w-full h-16 z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary dark:text-primary font-headline-md text-headline-md font-bold" style="font-variation-settings: 'FILL' 1;">security</span>
<span class="font-headline-md text-headline-md font-bold text-primary dark:text-primary">Thraksha Guardian</span>
</div>
<div>
<button class="p-2 rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-high transition-colors active:scale-95 text-on-surface-variant dark:text-on-surface-variant">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop mb-24 relative overflow-hidden">
<!-- Ambient Background Glow -->
<div class="absolute inset-0 pointer-events-none flex items-center justify-center">
<div class="w-[500px] h-[500px] bg-primary/5 rounded-full blur-[100px]"></div>
</div>
<div class="w-full max-w-xl z-10 space-y-8">
<!-- User Input -->
<div class="flex justify-end w-full mb-6">
<div class="bg-surface-container-low px-4 py-3 rounded-t-xl rounded-bl-xl border border-outline-variant max-w-[80%]">
<p class="font-body-md text-body-md text-on-surface">Start my mode</p>
</div>
</div>
<!-- Thraksha Response -->
<div class="flex justify-start w-full mb-8">
<div class="flex items-end gap-3 max-w-[90%]">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center flex-shrink-0 border border-outline-variant">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<div class="bg-surface-container px-5 py-4 rounded-t-xl rounded-br-xl shadow-lg border border-surface-container-highest">
<p class="font-body-lg text-body-lg text-on-surface mb-1">Which mode would you like to start?</p>
<p class="font-label-md text-label-md text-on-surface-variant">Select an automation preset below.</p>
</div>
</div>
</div>
<!-- Mode Options -->
<div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full">
<!-- Meeting Mode -->
<button class="bg-[#161719] border border-surface-container-highest rounded-[24px] p-5 flex flex-col items-center justify-center gap-3 hover:border-primary/30 transition-all hover:shadow-[0_0_15px_rgba(0,209,255,0.15)] group relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-surface-variant group-hover:bg-primary transition-colors"></div>
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">meeting_room</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Meeting Mode</span>
</button>
<!-- Focus Mode -->
<button class="bg-[#161719] border border-surface-container-highest rounded-[24px] p-5 flex flex-col items-center justify-center gap-3 hover:border-primary/30 transition-all hover:shadow-[0_0_15px_rgba(0,209,255,0.15)] group relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-surface-variant group-hover:bg-primary transition-colors"></div>
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">center_focus_strong</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Focus Mode</span>
</button>
<!-- Driving Mode -->
<button class="bg-[#161719] border border-surface-container-highest rounded-[24px] p-5 flex flex-col items-center justify-center gap-3 hover:border-primary/30 transition-all hover:shadow-[0_0_15px_rgba(0,209,255,0.15)] group relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-surface-variant group-hover:bg-primary transition-colors"></div>
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center group-hover:bg-primary/10 transition-colors">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">directions_car</span>
</div>
<span class="font-label-md text-label-md text-on-surface">Driving Mode</span>
</button>
</div>
<!-- Manual Input Fallback -->
<div class="mt-8 pt-6 border-t border-surface-container-highest w-full relative">
<input class="w-full bg-[#161719] border border-[#2D2E30] rounded-xl px-4 py-3 font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary transition-colors pl-10" placeholder="Or type a custom command..." type="text"/>
<span class="material-symbols-outlined absolute left-3 top-9 text-on-surface-variant pointer-events-none">chat</span>
<button class="absolute right-2 top-8 text-primary hover:text-primary-fixed transition-colors">
<span class="material-symbols-outlined">send</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 bg-surface-container dark:bg-surface-container shadow-sm flex justify-around items-center h-20 px-4 pb-2 md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-surface-variant dark:hover:bg-surface-variant transition-all active:scale-90 duration-200 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">shield</span>
<span class="font-label-md text-label-md">Protect</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container rounded-full px-5 py-1 hover:bg-surface-variant dark:hover:bg-surface-variant transition-all active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">bolt</span>
<span class="font-label-md text-label-md">Automate</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:bg-surface-variant dark:hover:bg-surface-variant transition-all active:scale-90 duration-200 rounded-lg" href="#">
<span class="material-symbols-outlined mb-1">analytics</span>
<span class="font-label-md text-label-md">Audit</span>
</a>
</nav>
</body></html>
